[env:lab-selftest]
; 平台版本必须锁死，不能写裸的 espressif32。
; 原因：platform.json 里每个依赖包的版本要求都随平台版本走，不锁的话
; 换台机器/换个时间可能解析到不同版本 → 已装的包被判"没装" → 重新去慢速 CDN 拉。
; 7.0.1 是母机的版本，也是当前全组统一版本（对应 ESP-IDF 6.0.1）。
; 升级流程：先在母机上升级并验证通过，再重新打一版 packages 整体下发。
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200

; N16R8 (16MB Flash + 8MB OPI PSRAM), 与主项目同款
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
